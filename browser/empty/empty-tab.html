<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todas as abas foram fechadas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, #f1f5f9 0%, #e2e8f0 100%);
      color: #1e293b;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }
    .card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      padding: 36px 32px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.18s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-wrapper {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      background-color: #f0f9ff;
      border: 1px solid #bae6fd;
      color: #0284c7;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }
    .icon-wrapper svg {
      width: 32px;
      height: 32px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 13.5px;
      color: #64748b;
      margin-bottom: 26px;
      line-height: 1.5;
    }
    .buttons-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 22px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 7px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }
    .btn-primary:hover {
      background-color: #0369a1;
      border-color: #0369a1;
    }
    .btn-primary:active {
      background-color: #075985;
    }
    .btn-secondary {
      background-color: #f8fafc;
      color: #334155;
      border-color: #cbd5e1;
    }
    .btn-secondary:hover {
      background-color: #f1f5f9;
      color: #0f172a;
      border-color: #94a3b8;
    }
    .btn-danger {
      background-color: #fff1f2;
      color: #e11d48;
      border-color: #fecdd3;
    }
    .btn-danger:hover {
      background-color: #ffe4e6;
      border-color: #fda4af;
    }
    .shortcut-hint {
      font-size: 11.5px;
      color: #94a3b8;
      border-top: 1px solid #f1f5f9;
      padding-top: 16px;
    }
    kbd {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 3px;
      padding: 2px 5px;
      font-size: 10px;
      color: #475569;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
      </svg>
    </div>
    <h1>Todas as abas foram fechadas.</h1>
    <p>Escolha como deseja prosseguir ou reabra a última aba que você estava utilizando:</p>
    
    <div class="buttons-container">
      <button class="btn btn-primary" id="btn-home" title="Abrir página inicial do sistema">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        Página Inicial
      </button>

      <button class="btn btn-primary" id="btn-localizadores" title="Abrir Meus Localizadores">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
        </svg>
        Meus Localizadores
      </button>

      <button class="btn btn-secondary" id="btn-undo" title="Reabrir a última aba fechada (Ctrl+Shift+T)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C23.77 11.23 19.65 8 12.5 8z"/>
        </svg>
        Desfazer
      </button>

      <button class="btn btn-danger" id="btn-close" title="Fechar a janela do navegador">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
        Fechar
      </button>
    </div>

    <div class="shortcut-hint">
      Atalhos: <kbd>Ctrl+Shift+T</kbd> para desfazer fechamento &bull; <kbd>Alt+F4</kbd> para fechar janela
    </div>
  </div>

  <script>
    document.getElementById('btn-home').addEventListener('click', () => {
      if (window.emptyAPI) window.emptyAPI.openHome();
    });
    document.getElementById('btn-localizadores').addEventListener('click', () => {
      if (window.emptyAPI) window.emptyAPI.openLocalizadores();
    });
    document.getElementById('btn-undo').addEventListener('click', () => {
      if (window.emptyAPI) window.emptyAPI.undo();
    });
    document.getElementById('btn-close').addEventListener('click', () => {
      if (window.emptyAPI) window.emptyAPI.closeWindow();
    });

    // Tecla de atalho local caso o foco esteja na página
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 't') {
        e.preventDefault();
        if (window.emptyAPI) window.emptyAPI.undo();
      }
    });
  </script>
</body>
</html>
