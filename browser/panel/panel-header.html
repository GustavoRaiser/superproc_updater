<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperPROC Web Panel</title>
  <link rel="stylesheet" href="panel-header.css">
</head>
<body>
  <div id="panel-header-container">
    <div id="resizer-handle" title="Arraste para redimensionar a largura"></div>
    <div class="panel-info-group" id="panel-info-group">
      <span id="panel-title" class="title">Carregando...</span>
    </div>
    <div class="panel-controls-group">
      <button id="btn-panel-pin" class="panel-nav-btn" title="Fixar / Desfixar Painel (Impedir fechar no hover)">📌</button>
      <button id="btn-panel-find-toggle" class="panel-nav-btn" title="Pesquisar no painel (Ctrl+F)">🔍</button>
      <button id="btn-panel-home" class="panel-nav-btn" title="Página Inicial do Painel (🏠)">🏠</button>
      <button id="btn-panel-back" class="panel-nav-btn" title="Voltar (‹)">‹</button>
      <button id="btn-panel-forward" class="panel-nav-btn" title="Avançar (›)">›</button>
      <button id="btn-panel-reload" class="panel-nav-btn" title="Recarregar (↻)">↻</button>
      <button id="btn-panel-promote" class="panel-nav-btn" title="Abrir em Aba Completa (🗗)">🗗</button>
      <button id="btn-panel-close" class="panel-nav-btn btn-close" title="Fechar e Resetar Painel (✕)">✕</button>
    </div>
  </div>
  <script src="panel-header.js"></script>
</body>
</html>
