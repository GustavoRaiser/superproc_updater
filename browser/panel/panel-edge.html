<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SuperPROC Panel Edge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    /* Faixa de arrasto ao longo de toda a borda esquerda do painel: redimensiona a largura como a alça do topo. */
    #edge { width: 100%; height: 100%; cursor: ew-resize; background: transparent; transition: background 0.15s ease; }
    #edge:hover, #edge.dragging { background: rgba(5, 123, 169, 0.65); }
  </style>
</head>
<body>
  <div id="edge" title="Arraste para redimensionar a largura"></div>
  <script src="panel-edge.js"></script>
</body>
</html>
